<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14">
  <rect width="880" height="340" rx="14" fill="#fbfaf7"/>
  <g>
    <rect x="30" y="40" width="470" height="260" rx="12" fill="#ffffff" stroke="#d9d4c9"/>
    <circle cx="52" cy="60" r="5" fill="#e2dfd8"/><circle cx="68" cy="60" r="5" fill="#e2dfd8"/><circle cx="84" cy="60" r="5" fill="#e2dfd8"/>
    <text x="110" y="65" fill="#77736a" font-size="13">Rex window</text>
    <rect x="46" y="84" width="200" height="200" rx="8" fill="#f4f2ed" stroke="#e2dfd8"/>
    <text x="62" y="108" fill="#1d1b16" font-weight="600">shell</text>
    <text x="62" y="134" fill="#77736a" font-family="ui-monospace, Menlo, monospace" font-size="12">$ rexweb open 3000</text>
    <rect x="258" y="84" width="226" height="200" rx="8" fill="#f4f2ed" stroke="#e2dfd8"/>
    <text x="274" y="108" fill="#1d1b16" font-weight="600">rexweb-pane</text>
    <text x="274" y="128" fill="#77736a" font-size="12">keeps the pane open</text>
  </g>
  <g>
    <rect x="270" y="150" width="226" height="138" rx="8" fill="#ffffff" stroke="#e2553a" stroke-width="2" transform="translate(-12 -6)"/>
    <text x="274" y="170" fill="#e2553a" font-weight="600">WebKit window</text>
    <text x="274" y="190" fill="#77736a" font-size="12">from RexWeb.app, laid exactly</text>
    <text x="274" y="206" fill="#77736a" font-size="12">over the pane's body</text>
    <rect x="274" y="222" width="190" height="10" rx="5" fill="#f1ede6"/>
    <rect x="274" y="240" width="150" height="10" rx="5" fill="#f1ede6"/>
    <rect x="274" y="258" width="170" height="10" rx="5" fill="#f1ede6"/>
  </g>
  <g>
    <rect x="590" y="52" width="260" height="112" rx="12" fill="#ffffff" stroke="#d9d4c9"/>
    <text x="610" y="82" fill="#1d1b16" font-weight="600">RexWeb.app</text>
    <text x="610" y="106" fill="#77736a" font-size="12">follows the layout with rex events</text>
    <text x="610" y="124" fill="#77736a" font-size="12">and session.view, keeps each window</text>
    <text x="610" y="142" fill="#77736a" font-size="12">just above its Rex window</text>
    <rect x="590" y="200" width="260" height="84" rx="12" fill="#ffffff" stroke="#d9d4c9"/>
    <text x="610" y="230" fill="#1d1b16" font-weight="600">rexweb CLI and agents</text>
    <text x="610" y="252" fill="#77736a" font-size="12">open, snapshot, click, type, eval,</text>
    <text x="610" y="270" fill="#77736a" font-size="12">screenshot over 127.0.0.1:18802</text>
  </g>
  <g stroke="#b8b2a6" stroke-width="1.5" fill="none" marker-end="url(#a)">
    <path d="M590 108 C 540 108, 530 160, 486 180"/>
    <path d="M720 200 L 720 168"/>
  </g>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#b8b2a6"/></marker></defs>
